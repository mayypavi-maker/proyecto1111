<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Reconocimiento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <div class="camara">
            <video id="video" autoplay></video>
        <div class="recuadro"></div>

    </div>



    <canvas id="canvas" style="display: none;"></canvas>

    <p id="estado">Colocá tu rostro dentro del óvalo</p>
    <a href="/" class="boton boton-negro"> Volver al inicio</a>

     <img src="{{ url_for('static', filename='img/logo.jpg') }}" class="logo">

        <h1>Reconocimiento Facial</h1>

        <p>Colocá tu rostro dentro del recuadro.</p>
       

</div>
<script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const estado = document.getElementById("estado");
    const dniActual = "{{ dni }}";

    let procesando = false;
    let intentoRealizado = false;

    function enviarUnaCaptura() {
        if (procesando || intentoRealizado) {
            return;
        }

        if (!video || video.videoWidth === 0 || video.videoHeight === 0) {
            return;
        }

        procesando = true;
        intentoRealizado = true;
        estado.textContent = "📸 Capturando...";

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const contexto = canvas.getContext("2d");
        contexto.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(blob => {
            if (!blob) {
                procesando = false;
                intentoRealizado = false;
                estado.textContent = "No se pudo capturar la imagen. Intentá de nuevo.";
                return;
            }

            const datos = new FormData();
            datos.append("foto", blob, "captura_final.jpg");
            datos.append("dni", dniActual);

            fetch("/verificar_rostro", {
                method: "POST",
                body: datos
            })
            .then(async response => {
                const texto = await response.text();
                try {
                    return JSON.parse(texto);
                } catch (error) {
                    throw new Error("La respuesta del servidor no es JSON.");
                }
            })
            .then(data => {
                if (data.coincide) {
                    estado.textContent = "✓ Rostro verificado correctamente.";
                    setTimeout(() => {
                        window.location.href = "/votacion";
                    }, 800);
                    return;
                }

                estado.textContent = data.mensaje || "No se reconoció el rostro.";
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
            })
            .catch(error => {
                console.error("Error al reconocer rostro:", error);
                estado.textContent = "No se pudo reconocer el rostro. Intentá de nuevo.";
                setTimeout(() => {
                    window.location.reload();
                }, 1500);
            })
            .finally(() => {
                procesando = false;
            });
        }, "image/jpeg");
    }

    navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
        }
    })
    .then(stream => {
        video.srcObject = stream;
        video.play();
    })
    .catch(error => {
        console.error("Error al acceder a la cámara:", error);
        estado.textContent = "No se pudo acceder a la cámara.";
    });

    setInterval(() => {
        if (!procesando && video && video.videoWidth > 0 && video.videoHeight > 0) {
            enviarUnaCaptura();
        }
    }, 2000);
</script>

</body>

</html>
