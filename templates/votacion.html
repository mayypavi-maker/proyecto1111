<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Votación</title>
          <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>

    <body>
        <h1>Bienvenido a la Votación Digital</h1>
        <div class="boleta">
            <div class="lista">
                <div class="Encabezado-Lista">
                    <span>101</span>
                    <h3>FRENTE CIUDADANO</h3>
                    <div class="logo-lista">FC</div>
                </div>

                <div class="categoría">
                <h2>SENADORES</h2>

                <div class="opción">
                    <input type="radio" name="senador" value="lista101">
                    <div class="candidatos">
                        <p>1. Candidato Senador </p>
                        <p>2. Candidata Senadora </p>
                    </div>
                </div>
            </div>
            <div class="categoría">
                <h4>DIPUTADOS</h4>
                <div class="opción">
                    <input type="radio" name="diputado" value="lista101">
                    <div class="candidatos">
                        <p>1. Candidato Diputado </p>
                        <p>2. Candidata Diputada </p>
                    </div>
                </div>
            </div>
        </div>  

    </body>
